name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.compiler }} / ${{ matrix.build }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: gcc, cc: gcc, cxx: g++, build: Release, sanitize: "OFF" }
          - { compiler: clang, cc: clang, cxx: clang++, build: Release, sanitize: "OFF" }
          - { compiler: gcc, cc: gcc, cxx: g++, build: Debug, sanitize: "ON" }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build }} -DPANTRYROUTE_SANITIZE=${{ matrix.sanitize }}
      - name: Build (warnings are errors)
        run: cmake --build build
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Smoke test on the sample day
        run: |
          ./build/pantryroute check examples/twin-ports-saturday.csv
          ./build/pantryroute solve examples/twin-ports-saturday.csv --vehicles 4 --capacity 30 \
            --json routes.json --svg routes.svg --manifest manifest.txt
          test -s routes.json && test -s routes.svg && test -s manifest.txt
      - name: Benchmark with time budget
        if: matrix.build == 'Release'
        run: ./build/pantryroute_bench --sizes 25,50,100,200 --seeds 5 --max-ms 250

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: cppcheck (warnings, performance, portability)
        run: cppcheck --enable=warning,performance,portability --std=c++20 --language=c++ --inline-suppr --quiet --error-exitcode=1 -I include src app
